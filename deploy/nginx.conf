# Example Nginx config for BookPrepper

server {
    listen 80;
    server_name bookprepper.com www.bookprepper.com;

    # Static assets produced by `pnpm --filter web build`
    root /var/www/bookprepper/web;
    index index.html;

    # Health endpoint, proxied to the API so it reflects real database state.
    # A regex location (matched ahead of the SPA catch-all below) rather than an
    # exact `=` match, so /healthz/ is covered too: a monitor configured with the
    # trailing slash would otherwise fall through to try_files and get index.html
    # with an unconditional 200 — the exact failure this endpoint exists to catch.
    location ~ ^/healthz/?$ {
        # proxy_pass may not carry a URI part inside a regex location, so normalize
        # the path here instead; this also folds /healthz/ onto the API route.
        rewrite ^ /healthz break;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API's check gives up on the DB pool at 10s, so allow it to answer
        # with its own 503 rather than having nginx cut in with a 504.
        proxy_read_timeout 15s;
        access_log off;
    }

    # Serve the SPA and let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API reverse proxy to the Fastify server
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Gzip compression for JSON responses
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
}

